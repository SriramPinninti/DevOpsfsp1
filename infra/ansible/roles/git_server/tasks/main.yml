- name: Install Packages
  package:
    name: git
    state: present

- name: git_user
  user:			        #creating a user on the git_server
      name: git
      shell: /bin/bash



- name: keys allowed to use git
  authorized_key:
        user: git
        state: present
        key: '{{item}}'
  with_file: 
         - ssh_keys/ram   #this key will have acces to git server as user git
         #-ssh_keys/another #this too



- name: create repositories
  command: "{{'git init --bare /home/git/repos/' + item + '.git' }}"
  become_user: git
  args:
     creates: "{{'/home/git/repos/' + item + '.git/HEAD'}}"
  loop:
  - repo1
  - repo2

